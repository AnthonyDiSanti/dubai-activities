    />

      name="description"
      content="A personal guide to memorable activities, nights, classes, and escapes in and around Dubai."

    <title>Dubai activities</title>
    <!-- Critical first-paint styles intentionally precede the application bundle. -->
    <style id="boot-loader-styles">
      @font-face { font-family: "Space Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url('./node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2') format('woff2'); }
html { background: #16110e; }
      body { margin: 0; }
      .boot-loader { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #16110e radial-gradient(rgba(255,255,255,.032) 1px,transparent 1px) 0 0 / 3px 3px; color: #e9a94b; font: 400 9px "Space Mono", monospace; letter-spacing: .2em; }
      .boot-loader p { margin: 0; }
      /* Shared by the inline pre-mount shell and the pending hero photo. */
.site-loader {
  --tube: .35;
  --tr: #ff4fa3;
  display: block;
  width: var(--site-loader-size, 64px);
  height: var(--site-loader-size, 64px);
  flex: none;
}
@keyframes trace { to { stroke-dashoffset: -100; } }
@media (prefers-reduced-motion: reduce) {
  .site-loader { --ld-anim: none; --ld-off: -28.5; }
}

    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" class="site-loader" aria-hidden="true" focusable="false" style="--tube:.35;--tr:#ff4fa3">

</svg>
        <p>Getting the guide ready…</p>
      </div>
    </div>

</html>
